services:
  aurora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=sqlite:/app/data/aurora.db
      - LOG_LEVEL=info
      # Укажите пути к медиатекам через запятую (пути внутри контейнера)
      # Пример: /app/media/movies,/app/media/tv
      - MEDIA_PATHS=/app/media/movies
      # Обложки с TMDB: ключ берётся из .env на хосте (пусто — обложки отключены)
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_LANGUAGE=ru-RU
      - CACHE_DIR=/app/data/cache
    volumes:
      # Та же БД, что и при локальном запуске (bind-mount каталога ./data)
      - ./data:/app/data
      # Медиатеки (монтируйте ваши папки с фильмами/сериалами)
      # Путь на хосте -> путь в контейнере
      - /path/to/media:/app/media/movies:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
